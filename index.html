<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bhanu Auto Parts & Service</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --red: #e31e24; --black: #1a1a1a; --yellow: #ffcc00; }
        body { font-family: sans-serif; margin: 0; background: #f4f4f4; text-align: center; }
        header { background: var(--black); color: white; padding: 20px; border-bottom: 4px solid var(--red); }
        .tagline { color: var(--yellow); font-size: 14px; font-weight: bold; margin-top: 5px; }
        
        /* Menu Buttons */
        .container { padding: 20px; max-width: 500px; margin: auto; }
        .box { 
            background: white; margin-bottom: 15px; padding: 20px; border-radius: 12px;
            display: flex; align-items: center; justify-content: space-between;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1); border-left: 6px solid var(--red);
            cursor: pointer;
        }
        .box i { font-size: 24px; color: var(--red); }
        .box h3 { margin: 0; font-size: 18px; flex-grow: 1; margin-left: 15px; text-align: left; }

        /* Full Screen Gallery */
        #gallery { 
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: white; z-index: 1000; overflow-y: auto; 
        }
        .nav { background: var(--black); color: white; padding: 15px; display: flex; align-items: center; position: sticky; top: 0; }
        .back { background: var(--red); color: white; border: none; padding: 10px 15px; border-radius: 5px; cursor: pointer; }
        
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 15px; }
        .grid img, .grid video { width: 100%; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); height: 180px; object-fit: cover; }
        
        .footer { padding: 20px; background: #ddd; margin-top: 20px; font-weight: bold; }
        .wa-link { color: #25d366; text-decoration: none; font-size: 20px; }
    </style>
</head>
<body>

<header>
    <h1>BHANU AUTO PARTS</h1>
    <div class="tagline">ENGINE SPECIALIST • SPARE PARTS • REPAIRING</div>
</header>

        <i class="fas fa-cogs"></i>
        <h3>Spare Parts & Oil</h3>
        <i class="fas fa-arrow-right"></i>
    </div>

    <div class="box" onclick="show('service', 'Service & Repairing', 4)">
        <i class="fas fa-tools"></i>
        <h3>Service Work</h3>
        <i class="fas fa-arrow-right"></i>
    </div>

    <div class="box" onclick="show('accessories', 'Bike Accessories', 3)">
        <i class="fas fa-lightbulb"></i>
        <h3>Accessories</h3>
        <i class="fas fa-arrow-right"></i>
    </div>
</div>
