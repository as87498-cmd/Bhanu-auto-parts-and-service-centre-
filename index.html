<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bhanu Auto Parts & Service</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --red: #e31e24; --black: #1a1a1a; --yellow: #ffcc00; }
        body { font-family: 'Arial', sans-serif; margin: 0; background: #f4f4f4; }
        header { background: var(--black); color: white; padding: 20px; text-align: center; border-bottom: 4px solid var(--red); }
        .container { padding: 15px; max-width: 500px; margin: auto; }
        .box { 
            background: white; margin-bottom: 12px; padding: 15px; border-radius: 10px;
            display: flex; align-items: center; justify-content: space-between;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1); border-left: 5px solid var(--red);
            cursor: pointer;
        }
        .box i { font-size: 22px; color: var(--red); }
        .box h3 { margin: 0; font-size: 16px; flex-grow: 1; margin-left: 15px; }

        /* Gallery Overlay */
        #gallery { 
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: #fff; z-index: 9999; overflow-y: auto; 
        }
        .nav { background: var(--black); color: white; padding: 15px; display: flex; align-items: center; position: sticky; top: 0; }
        .back-btn { background: var(--red); color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; }
        
        .media-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 15px; }
        .media-grid img { width: 100%; height: 150px; object-fit: cover; border-radius: 8px; background: #eee; }
        .media-grid video { width: 100%; border-radius: 8px; }
    </style>
</head>
<body>

<header>
    <h1 style="margin:0; font-size:1.4rem;">BHANU AUTO PARTS</h1>
    <div style="color:var(--yellow); font-size:12px; font-weight:bold;">GENUINE PARTS • EXPERT SERVICE</div>
</header>

<div class="container">
    <div class="box" onclick="openGallery('parts', 'Spare Parts')">
        <i class="fas fa-cog"></i>
        <h3>Spare Parts & Oil</h3>
        <i class="fas fa-chevron-right"></i>
    </div>

    <div class="box" onclick="openGallery('service', 'Service Work')">
        <i class="fas fa-tools"></i>
        <h3>Service Work</h3>
        <i class="fas fa-chevron-right"></i>
    </div>
</div>

<div id="gallery">
    <div class="nav">
        <button class="back-btn" onclick="closeGallery()">← BACK</button>
        <span id="gallery-title" style="margin-left:15px; font-weight:bold;"></span>
    </div>
    <div class="media-grid" id="grid-content">
        </div>
</div>
