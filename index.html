<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bhanu Auto Parts & Service Centre</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary: #d32f2f; /* Racing Red */
            --dark: #212121;
            --accent: #ffb300; /* Tool/Oil Yellow */
            --bg: #ffffff;
        }

        body { font-family: 'Arial', sans-serif; margin: 0; background: var(--bg); color: var(--dark); text-align: center; }
        
        header { 
            background: var(--dark); 
            color: white; 
            padding: 30px 15px; 
            border-bottom: 5px solid var(--primary);
        }

        h1 { margin: 0; font-size: 1.6rem; text-transform: uppercase; letter-spacing: 1px; }
        .tagline { font-size: 0.9rem; color: var(--accent); margin-top: 5px; }

        .menu-container { padding: 20px; display: flex; flex-direction: column; gap: 15px; max-width: 500px; margin: auto; }

        .btn-card {
            background: #f1f1f1;
            padding: 20px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            text-decoration: none;
            color: var(--dark);
            font-weight: bold;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            border-left: 6px solid var(--primary);
            cursor: pointer;
        }

        .btn-card i { font-size: 1.4rem; color: var(--primary); }

        /* Gallery Page Styles */
        #gallery-screen {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: white; z-index: 100; overflow-y: auto;
        }

        .gallery-nav { 
            padding: 15px; background: var(--dark); color: white; 
            display: flex; align-items: center; position: sticky; top: 0;
        }

        .back-btn { background: var(--primary); color: white; border: none; padding: 8px 15px; border-radius: 4px; margin-right: 15px; }

        .media-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 15px; }
        .media-grid img, .media-grid video { width: 100%; border-radius: 8px; border: 1px solid #ddd; height: 150px; object-fit: cover; }

        .whatsapp-btn {
            position: fixed; bottom: 20px; right: 20px;
            background: #25d366; color: white; width: 60px; height: 60px;
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            font-size: 30px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); text-decoration: none;
        }
    </style>
</head>
<body>

<header>
    <h1>Bhanu Auto Parts</h1>
    <div class="tagline">Genuine Spares & Expert Service</div>
</header>

<div class="menu-container">
    <div class="btn-card" onclick="openCat('engine-parts', 'Engine & Spares')">
        <span><i class="fas fa-cogs"></i> &nbsp; Engine & Spares</span>
        <i class="fas fa-chevron-right"></i>
    </div>

    <div class="btn-card" onclick="openCat('service-work', 'Service & Repairing')">
        <span><i class="fas fa-tools"></i> &nbsp; Service Photos</span>
        <i class="fas fa-chevron-right"></i>
    </div>

    <div class="btn-card" onclick="openCat('accessories', 'Accessories')">
        <span><i class="fas fa-motorcycle"></i> &nbsp; Bike Accessories</span>
        <i class="fas fa-chevron-right"></i>
    </div>
</div>

<div id="gallery-screen">
    <div class="gallery-nav">
        <button class="back-btn" onclick="closeCat()">← Back</button>
        <span id="cat-title">Gallery</span>
    </div>
    <div class="media-grid" id="media-content">
        </div>
</div>

<a href="https://wa.me/91XXXXXXXXXX" class="whatsapp-btn">
    <i class="fab fa-whatsapp"></i>
</a>

<script>
    function openCat(folder, title) {
        document.getElementById('gallery-screen').style.display = 'block';
        document.getElementById('cat-title').innerText = title;
        
        let content = document.getElementById('media-content');
        content.innerHTML = ''; 

        // List of files (Aap apne hisab se file names yahan badal lo)
        let files = [];
        if(folder === 'engine-parts') {
            files = ['part1.jpg', 'part2.jpg']; 
        } else if(folder === 'service-work') {
            files = ['service1.mp4', 'service2.jpg'];
        } else if(folder === 'accessories') {
            files = ['acc1.jpg'];
        }

        files.forEach(file => {
            let path = `assets/${folder}/${file}`;
            if(file.includes('.mp4')) {
                content.innerHTML += `<video controls src="${path}"></video>`;
            } else {
                content.innerHTML += `<img src="${path}" onclick="window.open('${path}')">`;
            }
        });
    }

    function closeCat() {
        document.getElementById('gallery-screen').style.display = 'none';
    }
</script>

</body>
</html>
