<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jiyaji Aluminium Fabrication</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f4; margin: 0; padding: 20px; text-align: center; }
        h1 { color: #333; }
        .category-container { display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; margin-top: 30px; }
        .card { background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); width: 250px; cursor: pointer; transition: 0.3s; }
        .card:hover { transform: scale(1.05); }
        .card img { width: 100%; border-radius: 10px; }
        .gallery { display: none; margin-top: 20px; background: white; padding: 20px; border-radius: 15px; }
        .gallery img, .gallery video { width: 90%; max-width: 400px; margin: 10px; border-radius: 10px; border: 2px solid #ddd; }
        .back-btn { background: #333; color: white; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; margin-bottom: 20px; }
    </style>
</head>
<body>

    <h1>Jiyaji Aluminium & Glass Work</h1>
    <p>Scanner scan karke hamara kaam dekhein</p>

    <div id="main-menu" class="category-container">
        <div class="card" onclick="showGallery('aluminum-normal')">
            <img src="assets/aluminum-normal/photo1.jpg" onerror="this.src='https://via.placeholder.com/150?text=Aluminum+Normal'">
            <h3>Aluminum Normal</h3>
        </div>
        <div class="card" onclick="showGallery('domal-section')">
            <img src="assets/domal-section/photo1.jpg" onerror="this.src='https://via.placeholder.com/150?text=Domal+Section'">
            <h3>Domal Section</h3>
        </div>
        <div class="card" onclick="showGallery('glass-work')">
            <img src="assets/glass-work/photo1.jpg" onerror="this.src='https://via.placeholder.com/150?text=Glass+Work'">
            <h3>Glass & Railing</h3>
        </div>
    </div>

    <div id="gallery-view" class="gallery">
        <button class="back-btn" onclick="goBack()">← Back to Menu</button>
        <h2 id="gallery-title"></h2>
        <div id="media-list">
            </div>
    </div>

    <script>
        function showGallery(category) {
            document.getElementById('main-menu').style.display = 'none';
            document.getElementById('gallery-view').style.display = 'block';
            document.getElementById('gallery-title').innerText = category.replace('-', ' ').toUpperCase();
            
            let mediaList = document.getElementById('media-list');
            mediaList.innerHTML = ''; // Pehle wala saaf karein

            // Yahan aapko apni file ke naam likhne honge jo aapne upload kiye hain
            let files = [];
            if(category === 'aluminum-normal') {
                files = ['normal-1.jpg', 'normal-2.mp4']; // Example names
            } else if(category === 'domal-section') {
                files = ['domal-1.jpg', 'domal-2.jpg'];
            } else if(category === 'glass-work') {
                files = ['glass-1.jpg', 'glass-video.mp4'];
            }

            files.forEach(file => {
                let path = `assets/${category}/${file}`;
                if(file.endsWith('.mp4')) {
                    mediaList.innerHTML += `<video controls src="${path}"></video>`;
                } else {
                    mediaList.innerHTML += `<img src="${path}">`;
                }
            });
        }

        function goBack() {
            document.getElementById('main-menu').style.display = 'flex';
            document.getElementById('gallery-view').style.display = 'none';
        }
    </script>
</body>
</html>
