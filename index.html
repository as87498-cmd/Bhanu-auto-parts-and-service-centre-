<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bhanu Auto Parts & Service Centre</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary: #e31e24; /* Racing Red */
            --dark: #1a1a1a;    /* Tire Black */
            --accent: #ffcc00;  /* Warning Yellow */
        }
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background: #fdfdfd; color: var(--dark); }
        header { background: var(--dark); color: white; padding: 25px 15px; border-bottom: 4px solid var(--primary); text-align: center; }
        h1 { margin: 0; font-size: 1.5rem; text-transform: uppercase; }
        .tagline { color: var(--accent); font-size: 0.8rem; margin-top: 5px; font-weight: bold; }

        .menu-grid { padding: 20px; display: grid; gap: 15px; max-width: 500px; margin: auto; }
        
        .cat-card {
            background: white; border-radius: 12px; padding: 18px;
            display: flex; align-items: center; justify-content: space-between;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1); border-left: 6px solid var(--primary);
            cursor: pointer; transition: 0.2s;
        }
        .cat-card:active { transform: scale(0.96); }
        .info { display: flex; align-items: center; gap: 15px; }
        .info i { font-size: 1.6rem; color: var(--primary); }
        .info h3 { margin: 0; font-size: 1.1rem; }

        /* Gallery System */
        #gallery-view { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: white; z-index: 999; overflow-y: auto; }
        .nav-bar { background: var(--dark); color: white; padding: 15px; display: flex; align-items: center; position: sticky; top: 0; }
        .back-btn { background: var(--primary); color: white; border: none; padding: 8px 12px; border-radius: 5px; margin-right: 15px; cursor: pointer; }
        
        .media-container { padding: 15px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .media-container img, .media-container video { width: 100%; height: 160px; object-fit: cover; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        
        .footer { padding: 20px; text-align: center; background: #eee; margin-top: 30px; }
        .call-btn { background: #25d366; color: white; padding: 10px 20px; border-radius: 25px; text-decoration: none; display: inline-block; font-weight: bold; margin-top: 10px; }
    </style>
</head>
<body>

<header>
    <h1>BHANU AUTO PARTS</h1>
    <div class="tagline">BEST SERVICE • GENUINE PARTS • EXPERT REPAIRING</div>
</header>

<div class="menu-grid">
    <div class="cat-card" onclick="openGallery('parts', 'Genuine Spare Parts')">
        <div class="info">
            <i class="fas fa-oil-can"></i>
            <h3>Parts & Oil</h3>
        </div>
        <i class="fas fa-chevron-right"></i>
    </div>

    <div class="cat-card" onclick="openGallery('service', 'Repairing & Service')">
        <div class="info">
            <i class="fas fa-tools"></i>
            <h3>Service & Repairs</h3>
        </div>
        <i class="fas fa-chevron-right"></i>
    </div>

    <div class="cat-card" onclick="openGallery('accessories', 'Bike Accessories')">
        <div class="info">
            <i class="fas fa-lightbulb"></i>
            <h3>Accessories</h3>
        </div>
        <i class="fas fa-chevron-right"></i>
    </div>
</div>

<div id="gallery-view">
    <div class="nav-bar">
        <button class="back-btn" onclick="closeGallery()"><i class="fas fa-arrow-left"></i></button>
        <span id="title">Category Name</span>
    </div>
    <div class="media-container" id="media-list">
